{% if messages %}
<div class="container mt-4 animate-fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger bg-danger-subtle text-danger border-danger{% else %}alert-success bg-success-subtle text-success border-success{% endif %} alert-dismissible fade show custom-shadow" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close {% if message.tags != 'error' and message.tags != 'success' %}btn-close-white{% endif %}" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}

{% if form.non_field_errors %}
<div class="container mt-4 animate-fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="alert alert-danger bg-danger-subtle text-danger border-danger alert-dismissible fade show custom-shadow" role="alert">
                {{ form.non_field_errors }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
    </div>
</div>
{% endif %}
