{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 mb-4 mx-3 rounded custom-shadow">

                <h2 class="text-center mb-4">Авторизация</h2>

                <form method="post" action="{% url "users:login" %}" >
                    {% csrf_token %}
               \
                    <div class="mb-3">
                        <label for="{{form.username.id_for}}" class="form-label">
                            Имя пользователя
                        </label>
                        {{form.username}}
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Введите ваше имя пользователя"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">
                            Пароль
                        </label>
                        {{form.password}}
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Введите ваш пароль"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        Войти
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <a href="#">Забыли пароль?</a>
                    |
                    <a href="{% url 'users:registration' %}">
                        Создать аккаунт
                    </a>
                </div>

                <hr>

                <div class="text-center">
                    <p>Или авторизуйтесь через:</p>

                    <a href="#" class="btn btn-dark me-2">
                        <img
                            class="me-1"
                            src="{% static 'deps/icons/google.svg' %}"
                            alt="Google"
                            width="16"
                            height="16"
                        >
                        Google
                    </a>

                    <a href="#" class="btn btn-dark me-2">
                        <img
                            class="me-1"
                            src="{% static 'deps/icons/facebook.svg' %}"
                            alt="Facebook"
                            width="16"
                            height="16"
                        >
                        Facebook
                    </a>

                    <a href="#" class="btn btn-dark">
                        <img
                            class="me-1"
                            src="{% static 'deps/icons/github.svg' %}"
                            alt="GitHub"
                            width="16"
                            height="16"
                        >
                        GitHub
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock content %}
